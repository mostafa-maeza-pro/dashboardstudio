<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calypso Dashboard Studio - Workspace</title>

    <!-- Global Presentation & Platform Styles -->
    <link rel="stylesheet" href="https://mostafa-maeza-pro.github.io/dashboardstudio/GlobalStyle.css">

    <!-- External Charting Engine & Compression Utilities -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <!-- Native Host Runtime Mechanics (PlatformRuntime V2.0) -->
    <script src="https://mostafa-maeza-pro.github.io/dashboardstudio/PlatformRuntime.js"></script>
</head>
<body>

    <!-- MODERN GLASSMORPHIC LOADING OVERLAY -->
    <div id="studioGlobalLoader" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 99999; justify-content: center; align-items: center; flex-direction: column;">
        <div style="background: rgba(30, 41, 59, 0.92); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 22px 30px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5); min-width: 240px;">
            <div class="studio-loader-spinner" style="width: 42px; height: 42px; border: 3px solid rgba(56, 189, 248, 0.15); border-top-color: #38bdf8; border-right-color: #38bdf8; border-radius: 50%; animation: studioSpin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 12px;"></div>
            <span id="studioLoaderMsg" style="color: #f8fafc; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; font-family: inherit;">Hydrating Workspace...</span>
        </div>
        <style>
            @keyframes studioSpin { to { transform: rotate(360deg); } }
        </style>
    </div>

    <!-- ZONE 1: System Admin Control Bar -->
    <header class="admin-system-header" id="platformAdminBar">
        <div class="header-left-section">
            <div class="header-title-block">
                <h2 class="platform-title">📊 Calypso Dashboard Studio</h2>
                <span class="platform-subtitle">Universal Financial Intelligence & Visualization Platform</span>
            </div>
        </div>
        
        <div class="header-right-controls">
            <div class="upload-zone" style="display: flex; align-items: center; gap: 8px;">
                <label for="devFileInput" class="custom-file-upload">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path>
                    </svg>
                    Upload File(s)
                </label>
                <input type="file" id="devFileInput" accept=".contract,.data,.json" multiple>

                <button type="button" id="pasteSpecBtn" class="custom-file-upload" style="background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    Paste AI Spec
                </button>
            </div>

            <div class="user-menu-container" id="userMenuWrapper">
                <div class="user-menu-trigger" id="userMenuTrigger">
                    <div class="user-avatar" id="userAvatarAnchor">--</div>
                    <span class="user-name" id="userNameAnchor">Loading...</span>
                    <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="user-menu-dropdown" id="userMenuDropdown">
                    <div class="user-menu-item" id="themeToggleBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        Toggle Dark Mode
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Backdrop & Global Enlargement Modal -->
    <div id="studioPopoverBackdrop" class="studio-popover-backdrop"></div>

    <div id="ui-global-enlargement-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="ui-modal-title-text">Component Enlargement</h3>
                <div class="modal-header-controls">
                    <div class="ui-chassis-view-switch" id="modalViewSwitch">
                        <button class="chassis-switch-btn active" data-view="visual" title="Visual Chart">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 17v-5M12 17V7M17 17v-3"/></svg>
                        </button>
                        <button class="chassis-switch-btn" data-view="dataset" title="Supporting Dataset">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        </button>
                    </div>
                    <button id="ui-modal-close-btn" title="Close Modal">&times;</button>
                </div>
            </div>
            <div id="ui-modal-body-content"></div>
        </div>
    </div>

    <!-- ZONE 2: Global Canvas Shell -->
    <main id="globalCanvasShell" class="ui-global-canvas">
        <div id="ui-section-title-anchor">
            <div class="header-title-meta-group">
                <h1 class="canvas-title-header">Calypso Studio Workspace</h1>
                <div class="subtitle-area-container" style="display: inline-flex; align-items: center; gap: 8px;">
                    <p class="canvas-subtitle-header">⚡ Standby | Waiting for dashboard specification</p>
                    <button id="ui-applied-criteria-trigger" class="studio-discreet-subtitle-btn" title="Fetch Data & Query Parameters">
                        <svg class="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>

                    <div id="studioCriteriaDropdown" class="studio-popover-panel anchored-subtitle">
                        <div class="studio-popover-header">
                            <h4 class="studio-popover-title">Fetch Data</h4>
                            <button id="studioPopoverClose" class="studio-popover-close-btn" title="Close">&times;</button>
                        </div>
                        <div class="studio-popover-body">
                            <div id="studio-criteria-fields-container"></div>
                        </div>
                        <div class="studio-popover-footer">
                            <button id="studioPopoverCancel" class="studio-btn-secondary">Cancel</button>
                            <button id="studioPopoverSubmit" class="studio-btn-primary">Refresh Data</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <section class="dashboard-workspace">
            <div id="ui-kpi-grid-outlet" class="ui-workspace-section-row"></div>
            <div id="ui-charts-container-outlet" class="ui-workspace-section-row"></div>
            <div id="ui-data-matrix-table-outlet" class="ui-workspace-section-row"></div>
        </section>
    </main>

    <!-- GENERIC RUNTIME ENGINE -->
    <script>
    const IS_PRODUCTION_MODE = false;

    let CONTRACT_REGISTRY = {};
    let ACTIVE_PACKAGE_DATA = {};
    let currentDomain = "default";
    let runtimeParser = null;
    let CURRENT_SPEC = null;

    // Async Non-Blocking Task Executor for Visual Responsiveness
    function setWorkspaceLoading(isLoading, message = 'Processing Dataset...') {
        const loader = document.getElementById('studioGlobalLoader');
        const msgElem = document.getElementById('studioLoaderMsg');
        if (!loader) return;
        if (isLoading) {
            if (msgElem) msgElem.textContent = message;
            loader.style.display = 'flex';
        } else {
            loader.style.display = 'none';
        }
    }

    function runAsyncWithLoader(taskFn, message = 'Processing Dataset...') {
        setWorkspaceLoading(true, message);
        requestAnimationFrame(() => {
            setTimeout(() => {
                try {
                    taskFn();
                } catch (err) {
                    console.error("Hydration runtime error:", err);
                } finally {
                    setWorkspaceLoading(false);
                }
            }, 35);
        });
    }

    // Financial string to clean float parser
    function cleanNumber(val) {
        if (typeof val === 'number') return val;
        if (val === null || val === undefined) return 0;
        const cleanStr = String(val).replace(/,/g, '').trim();
        const num = parseFloat(cleanStr);
        return isNaN(num) ? 0 : num;
    }

    class DashboardRuntimeParser {
        constructor(options = {}) {
            this.spec = null;
            this.activeData = {};
            this.activeCriteria = [];
            this.chartInstances = {};
            this.domainTableStates = {};
            this.currentDomain = null;
            this.modalChartInstance = null;
            this.isProductionMode = options.isProductionMode ?? false;

            this._initGlobalChartDefaults();
            this._bindGlobalDelegations();
        }

        hydrate(spec, dataPackage, appliedCriteria = null) {
            if (!spec) return;
            this.spec = spec;
            this.activeData = dataPackage || {};

            if (appliedCriteria) {
                this.activeCriteria = Array.isArray(appliedCriteria) ? [...appliedCriteria] : [];
            }

            const availableDomains = Object.keys(this.activeData);
            this.currentDomain = this.spec.metadata?.activeDomain 
                || (availableDomains.length > 0 ? availableDomains[0] : "default");

            this._hydrateHeaderMeta();
            this._hydrateCriteriaPanel(false);
            this._hydrateKpis();
            this._hydrateCharts();
            this._hydrateDataGrid();

            if (typeof bindChartInteractiveEvents === 'function') {
                bindChartInteractiveEvents();
            }
        }

        // Dynamic Field Resolver for Wildcard Tokens ([LATEST_DATE], [<DATE>], [FIRST_DATE])
        _resolveField(field, rows = []) {
            if (!rows || rows.length === 0) return field;
            
            const datePattern = /^\d{1,2}-[A-Za-z]{3}-\d{2,4}$|^\d{4}-\d{2}-\d{2}$/;
            const dateCols = Object.keys(rows[0]).filter(k => datePattern.test(k.trim()));

            if (!field || field === '[<DATE>]' || field === '[LATEST_DATE]' || (datePattern.test(field) && !(field in rows[0]))) {
                return dateCols.length > 0 ? dateCols[dateCols.length - 1] : field;
            }
            if (field === '[FIRST_DATE]') {
                return dateCols.length > 0 ? dateCols[0] : field;
            }
            return field;
        }

        _hydrateHeaderMeta() {
            const titleElem = document.querySelector('.canvas-title-header');
            const subtitleElem = document.querySelector('.canvas-subtitle-header');

            if (titleElem && this.spec.metadata?.title) {
                titleElem.textContent = this.spec.metadata.title;
            }

            if (subtitleElem) {
                const now = new Date();
                const uploadTime = typeof formatSubtitleTimestamp === 'function' 
                    ? formatSubtitleTimestamp(now) 
                    : now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let valDate = "Live Active";
                const sampleRows = this.activeData[this.currentDomain] || [];
                if (sampleRows.length > 0) {
                    const dateCol = Object.keys(sampleRows[0]).find(k => /^\d{2}-[A-Za-z]{3}-\d{2,4}$/.test(k) || k.toLowerCase().includes('date'));
                    if (dateCol) {
                        valDate = /^\d{2}-[A-Za-z]{3}-\d{2,4}$/.test(dateCol) ? dateCol : sampleRows[0][dateCol];
                    }
                }

                subtitleElem.textContent = "⚡ " + uploadTime + " | Valuation Date: " + valDate;
            }
        }

        _hydrateCriteriaPanel(isInitial = false) {
            const container = document.getElementById('studio-criteria-fields-container');
            if (!container) return;

            const domainCfg = CONTRACT_REGISTRY[this.currentDomain] || {};
            const inputParameters = this.spec.criteriaDeck?.inputParameters 
                || (domainCfg.exposedCriteria || []).map(c => ({ id: 'param-' + c.name, label: c.name, field: c.name, type: c.type, defaultValue: c.defaultValue }));

            let html = '<div class="popover-primary-fields">' +
                '<div class="popover-section-label">' +
                    '<div class="popover-section-title-group">' +
                        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                            '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>' +
                            '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>' +
                        '</svg>' +
                        '<span>Input Parameters</span>' +
                    '</div>' +
                '</div>' +
                '<div class="popover-primary-scrollbox">';

            if (inputParameters.length === 0) {
                html += '<p style="font-size: 11px; opacity: 0.6; padding: 8px 0;">No adjustable parameters declared.</p>';
            } else {
                inputParameters.forEach(param => {
                    const activeVal = (!isInitial && this.activeCriteria.find(c => c.name === param.field))?.value 
                        ?? param.defaultValue 
                        ?? "";
                    
                    const isDatetime = param.type === "Datetime";
                    const inputType = isDatetime ? "datetime-local" : "text";
                    const formattedVal = isDatetime && typeof formatIsoToDatetimeLocal === 'function'
                        ? formatIsoToDatetimeLocal(activeVal)
                        : activeVal;

                    html += '<div class="studio-form-group">' +
                        '<label class="studio-form-label" for="param-' + param.field + '">' + param.label + '</label>' +
                        '<input type="' + inputType + '" id="param-' + param.field + '" class="studio-form-input criteria-input-field" data-field="' + param.field + '" value="' + formattedVal + '">' +
                    '</div>';
                });
            }

            html += '</div></div>';

            const auditDomains = Object.keys(this.spec.criteriaDeck?.preDefinedAudits?.domains || CONTRACT_REGISTRY);
            if (auditDomains.length > 0) {
                html += '<div class="popover-audit-context">' +
                    '<div class="popover-section-label">' +
                        '<div class="popover-section-title-group">' +
                            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                                '<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path><line x1="12" y1="14" x2="12" y2="17"></line>' +
                            '</svg>' +
                            '<span>Pre-Defined Criterias</span>' +
                        '</div>' +
                        '<button type="button" class="popover-fold-btn is-collapsed" id="studioAuditFoldBtn" title="Toggle View">' +
                            '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
                        '</button>' +
                    '</div>' +
                    '<div class="popover-audit-scrollbox is-collapsed" id="studioAuditScrollbox">' +
                        '<div class="contract-cards-viewport" style="background: transparent !important;">' +
                            '<div class="contract-cards-track" style="background: transparent !important;">';

                auditDomains.forEach(domName => {
                    const items = this.spec.criteriaDeck?.preDefinedAudits?.domains?.[domName] 
                        || (CONTRACT_REGISTRY[domName]?.presetCriteria || []).map(p => ({ label: p.name || p.label, fixedValue: p.fixedValue }));

                    html += '<div class="contract-card-slide" style="background: transparent !important; border: 1px solid rgba(148, 163, 184, 0.25) !important;">' +
                        '<div class="contract-card-header" style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.75;">' +
                            '<span>' + domName + '</span>' +
                            '<div class="card-slider-nav" style="display: inline-flex !important; flex-direction: row !important; align-items: center !important; gap: 4px !important;">' +
                                '<button type="button" class="slider-prev-action" data-slide-dir="-1" title="Previous">&lt;</button>' +
                                '<button type="button" class="slider-next-action" data-slide-dir="1" title="Next">&gt;</button>' +
                            '</div>' +
                        '</div>' +
                        '<div class="contract-card-body" style="background: transparent !important;">';

                    if (items.length === 0) {
                        html += '<p style="font-size: 11px; opacity: 0.6; padding: 4px 0;">No preset criteria locked.</p>';
                    } else {
                        items.forEach(crit => {
                            html += '<div class="studio-form-group" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">' +
                                '<span class="studio-form-label" style="font-size: 12px;">' + crit.label + '</span>' +
                                '<span class="criteria-read-only-tag">' + crit.fixedValue + '</span>' +
                            '</div>';
                        });
                    }

                    html += '</div></div>';
                });

                html += '</div></div></div></div>';
            }

            container.innerHTML = html;
            this._bindCriteriaDeckEvents();
        }

        _bindCriteriaDeckEvents() {
            const foldBtn = document.getElementById('studioAuditFoldBtn');
            const scrollbox = document.getElementById('studioAuditScrollbox');
            if (foldBtn && scrollbox) {
                foldBtn.onclick = () => {
                    foldBtn.classList.toggle('is-collapsed');
                    scrollbox.classList.toggle('is-collapsed');
                };
            }

            const track = document.querySelector('.contract-cards-track');
            if (track) {
                let currentSlide = 0;
                const slides = track.querySelectorAll('.contract-card-slide');
                const updateSlide = (idx) => {
                    currentSlide = Math.max(0, Math.min(idx, slides.length - 1));
                    track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
                };

                track.querySelectorAll('.slider-prev-action').forEach(b => {
                    b.onclick = () => updateSlide(currentSlide - 1);
                });
                track.querySelectorAll('.slider-next-action').forEach(b => {
                    b.onclick = () => updateSlide(currentSlide + 1);
                });
            }
        }

        _hydrateKpis() {
            const outlet = document.getElementById('ui-kpi-grid-outlet');
            if (!outlet) return;
            outlet.innerHTML = '';

            (this.spec.kpis || []).forEach(kpiSpec => {
                const domainRows = this.activeData[kpiSpec.domain || this.currentDomain] || [];
                const targetField = this._resolveField(kpiSpec.field, domainRows);

                const rawVal = this._computeAggregation(domainRows, targetField, kpiSpec.aggregation, kpiSpec.weightField);
                const formattedVal = this._formatValue(rawVal, kpiSpec.format);

                const cardHtml = '<div class="kpi-label-text">' + kpiSpec.label + '</div>' +
                    '<div class="kpi-value-container">' + formattedVal + '</div>' +
                    '<div class="kpi-sub-text">' + (kpiSpec.subtext || '') + '</div>';

                if (typeof createChassisComponent === 'function') {
                    const chassisCard = createChassisComponent('', cardHtml, false, kpiSpec.id || '');
                    outlet.appendChild(chassisCard);
                }
            });
        }

        _hydrateCharts() {
            const outlet = document.getElementById('ui-charts-container-outlet');
            if (!outlet) return;

            Object.values(this.chartInstances).forEach(chart => {
                if (chart && typeof chart.destroy === 'function') {
                    chart.destroy();
                }
            });
            this.chartInstances = {};
            outlet.innerHTML = '';

            (this.spec.charts || []).forEach(chartSpec => {
                const chartId = chartSpec.id;
                const domainRows = this.activeData[chartSpec.domain || this.currentDomain] || [];
                const { labels, datasets, seriesDataMap, tableData } = this._buildChartDataModel(chartSpec, domainRows);

                const bodyHtml = '<div class="chart-panel-content chart-visual-panel" style="position: relative; height: 280px; width: 100%;">' +
                        '<canvas id="' + chartId + '"></canvas>' +
                    '</div>' +
                    '<div class="chart-panel-content chart-data-panel is-hidden">' +
                        '<div class="chart-dataset-table-box" style="overflow: auto; max-height: 280px; width: 100%;">' +
                            '<table class="studio-data-table">' +
                                '<thead><tr>' + tableData.headers.map(h => '<th style="background: rgba(125,125,125,0.06); color: inherit;">' + h + '</th>').join('') + '</tr></thead>' +
                                '<tbody>' + tableData.rows.map(row => '<tr>' + row.map(cell => '<td>' + cell + '</td>').join('') + '</tr>').join('') + '</tbody>' +
                            '</table>' +
                        '</div>' +
                    '</div>';

                if (typeof createChassisComponent === 'function') {
                    const chassis = createChassisComponent(
                        chartSpec.title,
                        bodyHtml,
                        chartSpec.isExpandable ?? true,
                        chartId,
                        false,
                        chartSpec.hasDatasetToggle ?? true
                    );
                    outlet.appendChild(chassis);
                }

                const canvas = document.getElementById(chartId);
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    let chartConfig = null;

                    // Delegate to PlatformRuntime V2.0 Universal Engine if available
                    if (window.PlatformRuntime && typeof window.PlatformRuntime.buildChartJsConfig === 'function') {
                        chartConfig = window.PlatformRuntime.buildChartJsConfig(chartSpec, labels, seriesDataMap, ctx);
                    } else {
                        const chartType = chartSpec.type === 'horizontalBar' ? 'bar' : (chartSpec.type || 'bar');
                        const chartOpts = this._buildChartOptions(chartSpec);

                        if (chartSpec.type === 'horizontalBar' || chartSpec.indexAxis === 'y') {
                            chartOpts.indexAxis = 'y';
                        }

                        chartConfig = {
                            type: chartType,
                            data: { labels, datasets },
                            options: chartOpts
                        };
                    }

                    this.chartInstances[chartId] = new Chart(ctx, chartConfig);
                }
            });
        }

        _buildChartDataModel(chartSpec, rows) {
            const hasCategoryGrouping = Boolean(chartSpec.dimensions?.groupBy || chartSpec.categoryAxis);

            // A. Dynamic Horizon Trend Chart (Multi-date column matrices)
            if (chartSpec.dynamicHorizon?.enabled && !hasCategoryGrouping && rows.length > 0) {
                const pattern = new RegExp(chartSpec.dynamicHorizon.dateColumnPattern || '^\\d{2}-[A-Za-z]{3}-\\d{2,4}$|^\\d{4}-\\d{2}-\\d{2}$');
                const dateHeaders = Object.keys(rows[0] || {}).filter(k => pattern.test(k));

                const labels = dateHeaders.length > 0 ? dateHeaders : Object.keys(rows[0]).slice(-4);
                const defaultLabel = chartSpec.title || (this.currentDomain + ' Total');
                const seriesList = (chartSpec.series && chartSpec.series.length > 0)
                    ? chartSpec.series
                    : [{ label: defaultLabel, field: '[<DATE>]', color: '#38bdf8' }];

                const seriesDataMap = {};
                const datasets = seriesList.map(seriesCfg => {
                    const sField = seriesCfg.field || '[<DATE>]';
                    const dataPoints = labels.map(dateKey => {
                        return rows.reduce((acc, r) => acc + cleanNumber(r[dateKey]), 0);
                    });
                    seriesDataMap[sField] = dataPoints;

                    return {
                        label: seriesCfg.label || defaultLabel,
                        type: seriesCfg.type || chartSpec.type || 'bar',
                        data: dataPoints,
                        borderColor: seriesCfg.color || '#38bdf8',
                        backgroundColor: seriesCfg.type === 'line' ? 'transparent' : (seriesCfg.color || 'rgba(56, 189, 248, 0.4)'),
                        yAxisID: seriesCfg.yAxisID || (seriesCfg.yAxisIndex ? ('y' + seriesCfg.yAxisIndex) : 'y'),
                        tension: seriesCfg.tension ?? 0.2
                    };
                });

                const tableRows = labels.map((dh, idx) => [dh, ...datasets.map(ds => this._formatValue(ds.data[idx], { style: 'currency' }))]);
                return {
                    labels,
                    datasets,
                    seriesDataMap,
                    tableData: {
                        headers: ['Horizon Date', ...datasets.map(d => d.label)],
                        rows: tableRows
                    }
                };
            }

            // B. Categorical Grouping (Dimensions & Multi-Metric Combinations)
            const groupField = chartSpec.dimensions?.groupBy || chartSpec.categoryAxis || Object.keys(rows[0] || {})[0] || "Category";
            const seriesList = (chartSpec.series && chartSpec.series.length > 0)
                ? chartSpec.series
                : [{ field: chartSpec.valueAxis || Object.keys(rows[0] || {})[1] || "Amount", label: chartSpec.title || "Value" }];

            // Aggregate multiple series grouped by dimension
            const groupAggregates = {};
            rows.forEach(r => {
                const rawKey = r[groupField];
                const key = (rawKey !== undefined && rawKey !== null && String(rawKey).trim() !== '') ? String(rawKey) : "Other";
                if (!groupAggregates[key]) {
                    groupAggregates[key] = { _count: 0 };
                    seriesList.forEach(s => {
                        const resolvedF = this._resolveField(s.field, rows);
                        groupAggregates[key][resolvedF] = 0;
                    });
                }
                groupAggregates[key]._count += 1;
                seriesList.forEach(s => {
                    const resolvedF = this._resolveField(s.field, rows);
                    groupAggregates[key][resolvedF] += cleanNumber(r[resolvedF]);
                });
            });

            // Adjust averages for rates, strikes, yields, or moneyness metrics
            seriesList.forEach(s => {
                const resolvedF = this._resolveField(s.field, rows);
                const isAvg = (s.aggregation === 'avg') || /strike|rate|yield|pct|percent|moneyness|delta %|iv|implied/i.test(resolvedF);
                if (isAvg) {
                    Object.keys(groupAggregates).forEach(k => {
                        const count = groupAggregates[k]._count;
                        if (count > 0) {
                            groupAggregates[k][resolvedF] = groupAggregates[k][resolvedF] / count;
                        }
                    });
                }
            });

            // Determine sort sequence: chronological if temporal dimension, else by primary metric magnitude
            const primaryField = this._resolveField(seriesList[0].field, rows);
            let sortedKeys = Object.keys(groupAggregates).sort((a, b) => {
                const valA = Math.abs(groupAggregates[a][primaryField] || 0);
                const valB = Math.abs(groupAggregates[b][primaryField] || 0);
                return valB - valA;
            });

            if (/date|maturity|expiry|settle/i.test(groupField)) {
                sortedKeys.sort((a, b) => {
                    const timeA = new Date(a).getTime();
                    const timeB = new Date(b).getTime();
                    if (!isNaN(timeA) && !isNaN(timeB)) return timeA - timeB;
                    return a.localeCompare(b);
                });
            }

            const topN = chartSpec.dimensions?.topN || chartSpec.topN;
            if (topN && sortedKeys.length > topN) {
                const topKeys = sortedKeys.slice(0, topN);
                if (chartSpec.dimensions?.otherBucket ?? chartSpec.otherBucket ?? true) {
                    const otherBucket = { _count: 0 };
                    seriesList.forEach(s => {
                        const resolvedF = this._resolveField(s.field, rows);
                        const remainingSum = sortedKeys.slice(topN).reduce((sum, k) => sum + (groupAggregates[k][resolvedF] || 0), 0);
                        const isAvg = (s.aggregation === 'avg') || /strike|rate|yield|pct|percent/i.test(resolvedF);
                        otherBucket[resolvedF] = isAvg ? (remainingSum / Math.max(1, sortedKeys.length - topN)) : remainingSum;
                    });
                    groupAggregates["Other"] = otherBucket;
                    topKeys.push("Other");
                }
                sortedKeys = topKeys;
            }

            const labels = sortedKeys;
            const seriesDataMap = {};
            const datasets = [];

            seriesList.forEach((s) => {
                const resolvedF = this._resolveField(s.field, rows);
                const dataArr = labels.map(l => groupAggregates[l] ? groupAggregates[l][resolvedF] : 0);
                seriesDataMap[s.field] = dataArr;
                if (resolvedF !== s.field) {
                    seriesDataMap[resolvedF] = dataArr;
                }

                datasets.push({
                    label: s.label || s.field || chartSpec.title,
                    field: s.field,
                    type: s.type,
                    yAxisID: s.yAxisID || 'y',
                    data: dataArr
                });
            });

            const tableHeaders = [groupField, ...seriesList.map(s => s.label || s.field)];
            const tableRows = labels.map(l => [
                l,
                ...seriesList.map(s => {
                    const resolvedF = this._resolveField(s.field, rows);
                    const val = groupAggregates[l] ? groupAggregates[l][resolvedF] : 0;
                    const isRate = /strike|rate|yield|pct|percent|iv/i.test(resolvedF);
                    return this._formatValue(val, { style: isRate ? 'number' : 'currency', decimals: isRate ? 4 : 2 });
                })
            ]);

            return {
                labels,
                datasets,
                seriesDataMap,
                tableData: {
                    headers: tableHeaders,
                    rows: tableRows
                }
            };
        }

        _buildChartOptions(chartSpec) {
            const isHorizontal = chartSpec.type === 'horizontalBar' || chartSpec.indexAxis === 'y';

            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { boxWidth: 10, font: { size: 11 } }
                    }
                },
                scales: chartSpec.type === 'doughnut' ? {} : {
                    x: {
                        grid: { color: isHorizontal ? 'rgba(255, 255, 255, 0.05)' : 'transparent' },
                        ticks: isHorizontal ? { callback: (v) => this._formatValue(v, { style: 'currency', notation: 'compact' }) } : {}
                    },
                    y: {
                        grid: { color: !isHorizontal ? 'rgba(255, 255, 255, 0.05)' : 'transparent' },
                        ticks: !isHorizontal ? { callback: (v) => this._formatValue(v, { style: 'currency', notation: 'compact' }) } : {}
                    }
                }
            };
        }

        _getDomainState(domain) {
            if (!this.domainTableStates[domain]) {
                this.domainTableStates[domain] = {
                    sortKey: '',
                    sortDir: 1,
                    aggregates: {},
                    searchTerm: ''
                };
            }
            return this.domainTableStates[domain];
        }

        _hydrateDataGrid() {
            const outlet = document.getElementById('ui-data-matrix-table-outlet');
            if (!outlet) return;
            outlet.innerHTML = '';

            const gridConfig = this.spec.datagrids?.[0] || { id: "table-positions-matrix" };
            const markup = this._generateDataGridMarkup(gridConfig);

            if (typeof createChassisComponent === 'function') {
                const tableChassis = createChassisComponent(
                    gridConfig.title || (this.currentDomain + " Matrix"),
                    markup,
                    gridConfig.isExpandable ?? true,
                    gridConfig.id || "table-positions-matrix"
                );

                const bodyElem = tableChassis.querySelector('.ui-chassis-body');
                if (bodyElem) {
                    bodyElem.style.padding = '8px 20px';
                    bodyElem.style.width = '100%';
                    bodyElem.style.boxSizing = 'border-box';
                }

                outlet.appendChild(tableChassis);
            }

            this._syncDataGridModal(markup);
        }

        _generateDataGridMarkup(gridConfig) {
            const availableDomains = Object.keys(this.activeData);
            const activeDom = this.currentDomain;
            const domState = this._getDomainState(activeDom);
            
            const rawCols = CONTRACT_REGISTRY[activeDom]?.columns;
            let normalizedCols = [];

            if (Array.isArray(rawCols)) {
                normalizedCols = rawCols.map(c => typeof c === 'string' ? { name: c } : c);
            } else if (rawCols && typeof rawCols === 'object') {
                normalizedCols = Object.keys(rawCols).map(k => ({ name: k, type: rawCols[k] }));
            } else if (this.activeData[activeDom]?.[0]) {
                normalizedCols = Object.keys(this.activeData[activeDom][0]).map(k => ({ name: k }));
            }
            
            // Expand [<DATE>] wildcard into concrete sampleData horizon dates
            const expandedCols = [];
            const datePattern = /^\d{1,2}-[A-Za-z]{3}-\d{2,4}$|^\d{4}-\d{2}-\d{2}$/;
            normalizedCols.forEach(c => {
                if (c.name === '[<DATE>]') {
                    const sampleRow = this.activeData[activeDom]?.[0] || {};
                    const dateKeys = Object.keys(sampleRow).filter(k => datePattern.test(k.trim()));
                    dateKeys.forEach(dk => expandedCols.push({ name: dk, type: 'Number' }));
                } else {
                    expandedCols.push(c);
                }
            });
            normalizedCols = expandedCols;

            const domainSchema = gridConfig.domains?.[activeDom] || {
                columns: normalizedCols.map(c => {
                    const isDateOrAmt = /^\d{2}-[A-Za-z]{3}-\d{2,4}$/.test(c.name) || /balance|amount|notional|npv|mtm|value|vega|theta|delta/i.test(c.name);
                    
                    const defaultAgg = gridConfig.footerAggregates?.[c.name] 
                        || (isDateOrAmt ? (gridConfig.footerAggregates?.['[<DATE>]'] || 'SUM') : (c.name.toLowerCase().includes('client') || c.name.toLowerCase().includes('id') ? 'COUNT' : 'OFF'));
                    
                    return {
                        key: c.name,
                        label: c.name.replace(/_/g, ' '),
                        sortable: true,
                        format: isDateOrAmt ? 'currency' : undefined,
                        footerAgg: defaultAgg
                    };
                })
            };

            if (!domState.sortKey && gridConfig.defaultSort?.column) {
                domState.sortKey = this._resolveField(gridConfig.defaultSort.column, this.activeData[activeDom]);
                domState.sortDir = gridConfig.defaultSort.direction === 'asc' ? 1 : -1;
            }

            let tabsHtml = '';
            if (availableDomains.length > 1) {
                tabsHtml = '<div class="datagrid-domain-tabs" style="display: flex; gap: 8px; margin-bottom: 8px;">' +
                    availableDomains.map(dom => '<button type="button" class="datagrid-domain-tab-btn ' + (dom === activeDom ? 'active' : '') + '" data-domain="' + dom + '" style="padding: 4px 10px; font-size: 11px; border-radius: 4px; border: 1px solid rgba(125,125,125,0.2); background: ' + (dom === activeDom ? '#38bdf8' : 'transparent') + '; color: ' + (dom === activeDom ? '#0f172a' : 'inherit') + '; cursor: pointer;">' + dom + '</button>').join('') +
                '</div>';
            }

            let rows = [...(this.activeData[activeDom] || [])];
            if (domState.searchTerm) {
                const term = domState.searchTerm.toLowerCase();
                rows = rows.filter(r => Object.values(r).some(val => String(val).toLowerCase().includes(term)));
            }

            if (domState.sortKey) {
                const k = domState.sortKey;
                const dir = domState.sortDir;
                rows.sort((a, b) => {
                    const valA = cleanNumber(a[k]), valB = cleanNumber(b[k]);
                    if (valA !== 0 || valB !== 0) return (valA - valB) * dir;
                    return String(a[k] ?? '').localeCompare(String(b[k] ?? '')) * dir;
                });
            }

            const toolbarHtml = '<div class="table-toolbar" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: rgba(125,125,125,0.03); border-bottom: 1px solid rgba(125,125,125,0.12); font-size: 12px; position: sticky; top: 0; z-index: 12; backdrop-filter: blur(8px);">' +
                '<span class="fx-table-count-badge" id="fx-table-count-badge" style="font-size: 0.78rem; color: inherit; opacity: 0.7; font-weight: 500;">' + rows.length + ' records</span>' +
                '<div class="filter-box" style="position: relative;">' +
                    '<input type="text" class="fx-table-filter" placeholder="Search..." value="' + domState.searchTerm + '" style="padding: 3px 8px; font-size: 11px; border-radius: 4px; border: 1px solid rgba(125,125,125,0.25); background: transparent; color: inherit;">' +
                '</div>' +
            '</div>';

            const cols = domainSchema.columns;
            const theadHtml = '<thead style="position: sticky; top: 31px; z-index: 10; backdrop-filter: blur(8px);"><tr>' +
                cols.map(col => {
                    const isSorted = domState.sortKey === col.key;
                    const icon = !isSorted ? '⇅' : (domState.sortDir === 1 ? '▲' : '▼');
                    const iconOpacity = isSorted ? '1' : '0.4';
                    const colorStyle = isSorted ? 'color: #38bdf8;' : 'color: inherit;';
                    return '<th data-sort="' + col.key + '" style="background: rgba(125,125,125,0.06); ' + colorStyle + ' border-bottom: 1px solid rgba(125,125,125,0.2); cursor: pointer; padding: 6px 10px; font-size: 11px; text-align: left; user-select: none;">' +
                        col.label + ' <span class="sort-icon" style="opacity: ' + iconOpacity + '; font-size: 10px;">' + icon + '</span>' +
                    '</th>';
                }).join('') +
            '</tr></thead>';

            const tbodyHtml = '<tbody>' +
                rows.map(r => '<tr>' +
                    cols.map(c => '<td style="padding: 5px 10px; font-size: 11px; border-bottom: 1px solid rgba(125,125,125,0.08);">' +
                        (c.format ? this._formatValue(cleanNumber(r[c.key]), { style: c.format }) : (r[c.key] ?? '')) +
                    '</td>').join('') +
                '</tr>').join('') +
            '</tbody>';

            const isLightMode = document.body.classList.contains('light-mode');
            const selectBg = isLightMode ? '#ffffff' : '#0f172a';
            const selectColor = isLightMode ? '#0f172a' : '#f8fafc';

            const tfootHtml = '<tfoot style="position: sticky; bottom: 0; z-index: 10; backdrop-filter: blur(8px);"><tr>' +
                cols.map(col => {
                    const aggFunc = domState.aggregates[col.key] || col.footerAgg || 'OFF';
                    const aggVal = this._computeFooterValue(rows, col.key, aggFunc);
                    return '<td style="background: rgba(125,125,125,0.06); border-top: 1px solid rgba(125,125,125,0.2); padding: 4px 6px;">' +
                        '<div class="agg-cell-container" style="display: flex; align-items: center;">' +
                            '<button type="button" class="agg-result-pill" data-key="' + col.key + '" style="background: rgba(125,125,125,0.08); border: none; font-weight: 700; color: inherit; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer;">' +
                                (aggFunc === 'OFF' ? '<span style="opacity: 0.35; font-family: monospace;">-</span>' : aggVal) +
                            '</button>' +
                            '<select class="agg-col-select" data-key="' + col.key + '" style="display: none; font-size: 10px; padding: 1px 3px; border-radius: 3px; background: ' + selectBg + '; color: ' + selectColor + '; border: 1px solid #38bdf8;">' +
                                '<option value="OFF" ' + (aggFunc === 'OFF' ? 'selected' : '') + '>OFF</option>' +
                                '<option value="SUM" ' + (aggFunc === 'SUM' ? 'selected' : '') + '>SUM</option>' +
                                '<option value="AVG" ' + (aggFunc === 'AVG' ? 'selected' : '') + '>AVG</option>' +
                                '<option value="COUNT" ' + (aggFunc === 'COUNT' ? 'selected' : '') + '>COUNT</option>' +
                            '</select>' +
                        '</div>' +
                    '</td>';
                }).join('') +
            '</tr></tfoot>';

            return tabsHtml +
                '<div class="chart-dataset-table-box" style="overflow: auto; width: 100%; min-height: 520px; max-height: 600px; border: 1px solid rgba(125,125,125,0.12); border-radius: 6px;">' +
                    toolbarHtml +
                    '<table class="studio-data-table" style="width: 100%; border-collapse: collapse;">' +
                        theadHtml +
                        tbodyHtml +
                        tfootHtml +
                    '</table>' +
                '</div>';
        }

        _computeFooterValue(rows, colKey, func) {
            if (func === 'OFF') return '-';
            if (func === 'COUNT') return rows.length;

            const numbers = rows.map(r => cleanNumber(r[colKey])).filter(v => !isNaN(v));
            if (numbers.length === 0) return '-';

            const sum = numbers.reduce((a, b) => a + b, 0);
            if (func === 'SUM') return this._formatValue(sum, { style: 'currency', notation: 'compact' });
            if (func === 'AVG') return this._formatValue(sum / numbers.length, { style: 'percent' });
            return '-';
        }

        _syncDataGridModal(freshMarkup) {
            const modal = document.getElementById('ui-global-enlargement-modal');
            const modalBody = document.getElementById('ui-modal-body-content');
            if (modal && modalBody && (modal.classList.contains('is-active') || modal.classList.contains('active'))) {
                if (modalBody.querySelector('.studio-data-table')) {
                    modalBody.innerHTML = freshMarkup;
                }
            }
        }

        _bindGlobalDelegations() {
            document.addEventListener('click', (e) => {
                const th = e.target.closest('th[data-sort]');
                if (!th) return;

                const colKey = th.getAttribute('data-sort');
                const state = this._getDomainState(this.currentDomain);
                if (state.sortKey === colKey) {
                    state.sortDir = state.sortDir === 1 ? -1 : 1;
                } else {
                    state.sortKey = colKey;
                    state.sortDir = 1;
                }
                this._hydrateDataGrid();
            });

            document.addEventListener('input', (e) => {
                if (!e.target.classList.contains('fx-table-filter')) return;
                const term = e.target.value;
                const state = this._getDomainState(this.currentDomain);
                state.searchTerm = term;
                this._hydrateDataGrid();

                document.querySelectorAll('.fx-table-filter').forEach(inp => {
                    if (inp !== document.activeElement) inp.value = term;
                });
            });

            document.addEventListener('click', (e) => {
                const tabBtn = e.target.closest('.datagrid-domain-tab-btn');
                if (!tabBtn) return;
                this.currentDomain = tabBtn.getAttribute('data-domain');
                this._hydrateDataGrid();
            });

            document.addEventListener('click', (e) => {
                const pill = e.target.closest('.agg-result-pill');
                if (pill) {
                    const select = pill.parentElement.querySelector('.agg-col-select');
                    pill.style.display = 'none';
                    select.style.display = 'inline-block';
                    select.focus();
                    return;
                }

                if (!e.target.classList.contains('agg-col-select')) {
                    document.querySelectorAll('.agg-col-select').forEach(sel => {
                        if (sel.style.display !== 'none') {
                            sel.style.display = 'none';
                            sel.parentElement.querySelector('.agg-result-pill').style.display = 'inline-block';
                        }
                    });
                }
            });

            document.addEventListener('change', (e) => {
                if (!e.target.classList.contains('agg-col-select')) return;
                const colKey = e.target.getAttribute('data-key');
                const func = e.target.value;
                const state = this._getDomainState(this.currentDomain);
                state.aggregates[colKey] = func;

                e.target.style.display = 'none';
                e.target.parentElement.querySelector('.agg-result-pill').style.display = 'inline-block';
                this._hydrateDataGrid();
            });

            const trigger = document.getElementById('ui-applied-criteria-trigger');
            const popover = document.getElementById('studioCriteriaDropdown');
            const backdrop = document.getElementById('studioPopoverBackdrop');
            const closeBtn = document.getElementById('studioPopoverClose');
            const cancelBtn = document.getElementById('studioPopoverCancel');
            const submitBtn = document.getElementById('studioPopoverSubmit');

            const togglePopover = (open) => {
                if (popover && backdrop) {
                    popover.classList.toggle('is-active', open);
                    backdrop.classList.toggle('is-active', open);
                }
            };

            if (trigger) trigger.onclick = () => togglePopover(true);
            if (closeBtn) closeBtn.onclick = () => { togglePopover(false); this._hydrateCriteriaPanel(false); };
            if (cancelBtn) cancelBtn.onclick = () => { togglePopover(false); this._hydrateCriteriaPanel(false); };
            if (backdrop) backdrop.onclick = () => { 
                togglePopover(false); 
                this._hydrateCriteriaPanel(false);
                closeModal();
            };

            if (submitBtn) {
                submitBtn.onclick = () => {
                    const inputs = document.querySelectorAll('.criteria-input-field');
                    this.activeCriteria = Array.from(inputs).map(inp => ({
                        name: inp.getAttribute('data-field'),
                        value: inp.value
                    }));
                    togglePopover(false);

                    runAsyncWithLoader(() => {
                        if (this.isProductionMode && typeof fetchDataFromCalypso === 'function') {
                            fetchDataFromCalypso();
                        } else {
                            this.hydrate(this.spec, this.activeData, this.activeCriteria);
                        }
                    }, 'Refreshing Valuation & Criteria...');
                };
            }

            // --- MODAL ZOOM / ENLARGEMENT HANDLERS ---
            const closeModal = () => {
                const modal = document.getElementById('ui-global-enlargement-modal');
                const bd = document.getElementById('studioPopoverBackdrop');
                if (modal) modal.classList.remove('is-active', 'active');
                if (bd) bd.classList.remove('is-active', 'active');
                if (this.modalChartInstance) {
                    this.modalChartInstance.destroy();
                    this.modalChartInstance = null;
                }
            };

            const modalCloseBtn = document.getElementById('ui-modal-close-btn');
            if (modalCloseBtn) modalCloseBtn.onclick = closeModal;

            // Expand / Zoom Click Delegation (Card-Isolated Resolution)
            document.addEventListener('click', (e) => {
                const expandBtn = e.target.closest('.ui-chassis-zoom-trigger, .ui-chassis-expand-btn, button[title*="Enlarge"], button[title*="Expand"]');
                if (!expandBtn) return;

                let chassis = expandBtn.closest('.ui-proposal-chassis, .ui-chassis');
                if (!chassis) return;

                const modal = document.getElementById('ui-global-enlargement-modal');
                const modalBody = document.getElementById('ui-modal-body-content');
                const modalTitle = document.getElementById('ui-modal-title-text');
                const bd = document.getElementById('studioPopoverBackdrop');
                const viewSwitch = document.getElementById('modalViewSwitch');
                if (!modal || !modalBody) return;

                if (this.modalChartInstance) {
                    this.modalChartInstance.destroy();
                    this.modalChartInstance = null;
                }

                const titleElem = chassis.querySelector('.ui-chassis-title');
                if (modalTitle && titleElem) {
                    modalTitle.textContent = titleElem.textContent.trim();
                }

                const canvas = chassis.querySelector('canvas');
                if (canvas && this.chartInstances[canvas.id]) {
                    if (viewSwitch) viewSwitch.style.display = 'inline-flex';
                    const origChart = this.chartInstances[canvas.id];
                    const dataPanel = chassis.querySelector('.chart-data-panel');
                    const dataTableHtml = dataPanel ? dataPanel.innerHTML : '';

                    modalBody.innerHTML = `
                        <div class="chart-panel-content chart-visual-panel" style="position: relative; height: 500px; width: 100%;">
                            <canvas id="modal-enlarged-canvas"></canvas>
                        </div>
                        <div class="chart-panel-content chart-data-panel is-hidden" style="max-height: 500px; overflow: auto; width: 100%;">
                            ${dataTableHtml}
                        </div>
                    `;

                    document.querySelectorAll('#modalViewSwitch .chassis-switch-btn').forEach(b => {
                        b.classList.toggle('active', b.getAttribute('data-view') === 'visual');
                    });

                    const modalCanvas = document.getElementById('modal-enlarged-canvas');
                    if (modalCanvas && typeof Chart !== 'undefined') {
                        const modalCtx = modalCanvas.getContext('2d');
                        const rawConfig = origChart.config;

                        const modalDatasets = rawConfig.data.datasets.map(ds => {
                            const cloned = { ...ds, data: ds.data ? [...ds.data] : [] };
                            if (ds.type === 'line' && ds.fill && ds.borderColor && typeof ds.borderColor === 'string') {
                                if (window.PlatformRuntime && typeof window.PlatformRuntime.createChartColorGradient === 'function') {
                                    cloned.backgroundColor = window.PlatformRuntime.createChartColorGradient(modalCtx, ds.borderColor, 0.35, 0.01);
                                }
                            }
                            return cloned;
                        });

                        this.modalChartInstance = new Chart(modalCtx, {
                            type: rawConfig.type,
                            data: {
                                labels: rawConfig.data.labels ? [...rawConfig.data.labels] : [],
                                datasets: modalDatasets
                            },
                            options: {
                                ...(rawConfig.options || {}),
                                responsive: true,
                                maintainAspectRatio: false
                            }
                        });
                    }
                } else {
                    if (viewSwitch) viewSwitch.style.display = 'none';
                    const gridConfig = this.spec?.datagrids?.[0] || { id: "table-positions-matrix" };
                    modalBody.innerHTML = this._generateDataGridMarkup(gridConfig);
                }

                modal.classList.add('is-active', 'active');
                if (bd) bd.classList.add('is-active', 'active');
            });

            // View Switcher Delegation (Visual Chart vs Supporting Dataset)
            document.addEventListener('click', (e) => {
                const switchBtn = e.target.closest('#modalViewSwitch .chassis-switch-btn');
                if (!switchBtn) return;

                const view = switchBtn.getAttribute('data-view');
                document.querySelectorAll('#modalViewSwitch .chassis-switch-btn').forEach(b => b.classList.remove('active'));
                switchBtn.classList.add('active');

                const modalBody = document.getElementById('ui-modal-body-content');
                if (!modalBody) return;

                const visualPanel = modalBody.querySelector('.chart-visual-panel');
                const dataPanel = modalBody.querySelector('.chart-data-panel');
                if (visualPanel && dataPanel) {
                    if (view === 'visual') {
                        visualPanel.classList.remove('is-hidden');
                        dataPanel.classList.add('is-hidden');
                    } else {
                        visualPanel.classList.add('is-hidden');
                        dataPanel.classList.remove('is-hidden');
                    }
                }
            });
        }

        _computeAggregation(rows, field, op, weightField = null) {
            if (!rows || rows.length === 0) return 0;
            const lowerOp = (op || '').toLowerCase();
            if (lowerOp === 'count') return rows.length;

            const vals = rows.map(r => cleanNumber(r[field])).filter(v => !isNaN(v));
            if (vals.length === 0) return 0;

            if (lowerOp === 'sum') return vals.reduce((a, b) => a + b, 0);
            if (lowerOp === 'avg') return vals.reduce((a, b) => a + b, 0) / vals.length;
            if (lowerOp === 'weightedavg' && weightField) {
                let totalWeight = 0, sumProd = 0;
                rows.forEach(r => {
                    const v = cleanNumber(r[field]), w = cleanNumber(r[weightField]);
                    if (!isNaN(v) && !isNaN(w)) {
                        sumProd += v * w;
                        totalWeight += w;
                    }
                });
                return totalWeight !== 0 ? sumProd / totalWeight : 0;
            }
            return vals[0];
        }

        _formatValue(val, formatCfg = {}) {
            if (val === null || val === undefined || isNaN(val)) return '-';
            
            if (window.PlatformRuntime && typeof window.PlatformRuntime.formatMetricValue === 'function') {
                return window.PlatformRuntime.formatMetricValue(val, formatCfg);
            }

            const num = cleanNumber(val);
            if (formatCfg.style === 'currency') {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: formatCfg.currency || 'USD',
                    notation: formatCfg.notation || 'standard',
                    maximumFractionDigits: formatCfg.decimals ?? 2
                }).format(num);
            }

            if (formatCfg.style === 'percent') {
                return num.toFixed(formatCfg.decimals ?? 2) + '%';
            }

            return new Intl.NumberFormat('en-US', {
                notation: formatCfg.notation || 'standard',
                maximumFractionDigits: formatCfg.decimals ?? 0
            }).format(num);
        }

        _initGlobalChartDefaults() {
            if (typeof Chart !== 'undefined') {
                Chart.defaults.color = '#94a3b8';
                Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.08)';
                Chart.defaults.font.family = 'inherit';
            }
        }
    }

    window.DashboardRuntimeParser = DashboardRuntimeParser;

    // Tolerant Normalization Adapter for Any AST Variation
    function normalizeSpec(raw) {
        if (!raw) return null;
        const domainName = raw.d || raw.metadata?.activeDomain || Object.keys(raw.contractRegistry || {})[0] || "default";

        if (raw.s && Array.isArray(raw.s) && raw.s.length > 0) {
            ACTIVE_PACKAGE_DATA[domainName] = raw.s;
        }

        let kpis = [];
        if (Array.isArray(raw.kpis)) {
            kpis = raw.kpis.map((item, idx) => ({
                id: item.id || ('kpi-' + idx),
                label: item.label || item.title || item.metric || 'Metric',
                field: item.field || item.metric,
                aggregation: item.aggregation || 'sum',
                format: typeof item.format === 'string' 
                    ? { style: item.format.includes('curr') ? 'currency' : (item.format.includes('pct') ? 'percent' : 'number'), currency: 'USD' } 
                    : (item.format || { style: 'currency', currency: 'USD' }),
                domain: item.domain || domainName,
                subtext: item.subtext || '',
                dynamicHorizon: item.dynamicHorizon
            }));
        } else if (Array.isArray(raw.k)) {
            kpis = raw.k.map((item, idx) => ({
                id: 'kpi-' + idx,
                label: item[0],
                domain: item[1] || domainName,
                field: item[2],
                aggregation: item[3],
                format: { style: item[4] === 'curr' ? 'currency' : (item[4] === 'pct' ? 'percent' : 'number') },
                subtext: item[5] || '',
                weightField: item[6] || null
            }));
        }

        let charts = [];
        if (Array.isArray(raw.charts)) {
            charts = raw.charts.map((item, idx) => {
                const isHorizontal = item.type === 'horizontalBar' || item.indexAxis === 'y';
                const groupField = item.dimensions?.groupBy || item.categoryAxis || item.dimension;
                const valField = item.series?.[0]?.field || item.valueAxis || item.metric;

                return {
                    id: item.id || ('chart-' + idx),
                    title: item.title,
                    domain: item.domain || domainName,
                    type: isHorizontal ? 'bar' : (item.type || 'bar'),
                    indexAxis: isHorizontal ? 'y' : 'x',
                    stacked: item.stacked || false,
                    scales: item.scales || undefined,
                    categoryAxis: groupField,
                    valueAxis: valField,
                    dimensions: item.dimensions || (groupField ? { groupBy: groupField, topN: item.topN || 6, otherBucket: item.otherBucket ?? true } : {}),
                    series: item.series || (valField ? [{ field: valField, label: item.title }] : [{ label: item.title }]),
                    dynamicHorizon: item.dynamicHorizon,
                    isExpandable: item.isExpandable ?? true,
                    hasDatasetToggle: item.hasDatasetToggle ?? true
                };
            });
        } else if (Array.isArray(raw.c)) {
            charts = raw.c.map(item => ({
                id: item[0],
                title: item[1],
                domain: item[2] || domainName,
                type: item[3],
                dimensions: item[4] && item[4] !== 'dynamic' ? { groupBy: item[4] } : {},
                series: item[5] ? [{ field: item[5], aggregation: 'sum', label: item[1] }] : [{ type: 'bar', label: item[1] }],
                dynamicHorizon: item[4] === 'dynamic' ? { enabled: true, dateColumnPattern: '^\\d{2}-[A-Za-z]{3}-\\d{2,4}$' } : undefined,
                isExpandable: true,
                hasDatasetToggle: true
            }));
        }

        let datagrids = raw.datagrids || [{ id: "table-positions-matrix", isExpandable: true }];
        if (Array.isArray(datagrids)) {
            datagrids = datagrids.map(dg => ({
                ...dg,
                id: dg.id || "table-positions-matrix",
                title: dg.title || (domainName + " Matrix"),
                isExpandable: dg.isExpandable ?? true
            }));
        }

        return {
            metadata: {
                title: raw.metadata?.title || raw.t || raw.title || (domainName + " Dashboard"),
                activeDomain: domainName
            },
            criteriaDeck: raw.criteriaDeck || {},
            kpis: kpis.length > 0 ? kpis : undefined,
            charts: charts.length > 0 ? charts : undefined,
            datagrids: datagrids
        };
    }

    function applyCompleteSpec(specObject) {
        if (!specObject) return;

        if (specObject.contractRegistry) {
            Object.assign(CONTRACT_REGISTRY, specObject.contractRegistry);
        }

        if (specObject.sampleData) {
            Object.assign(ACTIVE_PACKAGE_DATA, specObject.sampleData);
        } else if (specObject.sampleDataPackage) {
            Object.assign(ACTIVE_PACKAGE_DATA, specObject.sampleDataPackage);
        }

        CURRENT_SPEC = normalizeSpec(specObject);
        if (runtimeParser) {
            runtimeParser.hydrate(CURRENT_SPEC, ACTIVE_PACKAGE_DATA);
        }
    }

    function processIncomingPayloadGeneric(parsed, filename = "") {
        if (!parsed) return false;

        if (parsed.kpis || parsed.charts || parsed.datagrids || parsed.$schema) {
            applyCompleteSpec(parsed);
            return true;
        }

        const cleanName = filename.replace(/\.(data|json|contract)$/i, '').trim();
        const domain = parsed.metadata?.domain 
            || parsed.metadata?.templateId 
            || (cleanName && cleanName !== "data" && cleanName !== "" ? cleanName : currentDomain);

        if (parsed.columns || parsed.exposedCriteria) {
            CONTRACT_REGISTRY[domain] = parsed;
            if (parsed.sampleData) {
                ACTIVE_PACKAGE_DATA[domain] = parsed.sampleData;
            }
            currentDomain = domain;
            if (CURRENT_SPEC && CURRENT_SPEC.metadata) {
                CURRENT_SPEC.metadata.activeDomain = domain;
            } else {
                CURRENT_SPEC = normalizeSpec({
                    d: domain,
                    t: domain + " Dashboard",
                    s: ACTIVE_PACKAGE_DATA[domain] || []
                });
            }
            if (runtimeParser) {
                runtimeParser.hydrate(CURRENT_SPEC, ACTIVE_PACKAGE_DATA);
            }
            return true;
        }

        const rows = Array.isArray(parsed) ? parsed : (parsed.data || parsed.sampleData || []);
        if (rows.length > 0) {
            ACTIVE_PACKAGE_DATA[domain] = rows;
            currentDomain = domain;
            if (CURRENT_SPEC && CURRENT_SPEC.metadata) {
                CURRENT_SPEC.metadata.activeDomain = domain;
            } else {
                CURRENT_SPEC = normalizeSpec({
                    d: domain,
                    t: domain + " Dashboard",
                    s: rows
                });
            }
            if (runtimeParser) {
                runtimeParser.hydrate(CURRENT_SPEC, ACTIVE_PACKAGE_DATA);
            }
            return true;
        }

        return false;
    }

    function loadSpecFromUrl() {
        let rawPayload = null;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('spec')) {
            rawPayload = urlParams.get('spec');
        }

        if (!rawPayload && window.location.hash) {
            const hash = window.location.hash;
            if (hash.includes('spec=')) {
                rawPayload = hash.split('spec=')[1].split('&')[0];
            } else if (hash.length > 2) {
                rawPayload = hash.substring(1);
            }
        }

        if (!rawPayload) return;

        try {
            let jsonString = null;
            const cleanPayload = decodeURIComponent(rawPayload).trim();

            try {
                let b64 = cleanPayload.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4 !== 0) b64 += '=';
                jsonString = decodeURIComponent(escape(atob(b64)));
            } catch (e) {
                jsonString = null;
            }

            if (!jsonString && typeof LZString !== 'undefined') {
                try {
                    jsonString = LZString.decompressFromEncodedURIComponent(cleanPayload);
                } catch (e) {
                    jsonString = null;
                }
            }

            if (!jsonString) {
                try {
                    JSON.parse(cleanPayload);
                    jsonString = cleanPayload;
                } catch (e) {
                    jsonString = null;
                }
            }

            if (jsonString) {
                const parsed = JSON.parse(jsonString);
                runAsyncWithLoader(() => {
                    applyCompleteSpec(parsed);
                }, 'Loading Initial Specification...');
            }
        } catch (err) {
            console.error("Failed to load specification from URL:", err);
        }
    }

    // Platform Bootstrap Lifecycle
    window.addEventListener('DOMContentLoaded', () => {
        runtimeParser = new DashboardRuntimeParser({ isProductionMode: IS_PRODUCTION_MODE });
        loadSpecFromUrl();

        // 1. File Upload Facility with Non-blocking Visual Spinner
        const fileInput = document.getElementById('devFileInput');
        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        runAsyncWithLoader(() => {
                            const rawText = evt.target.result || "";
                            const sanitizedText = String(rawText).replace(/,\s*"\[<DATE>\]"\s*:\s*"[^"]*"/g, '');
                            const parsed = JSON.parse(sanitizedText);
                            processIncomingPayloadGeneric(parsed, file.name);
                        }, `Hydrating ${file.name}...`);
                    };
                    reader.readAsText(file);
                });
                e.target.value = '';
            });
        }

        // 2. Paste AI Spec Facility with Non-blocking Visual Spinner
        const pasteBtn = document.getElementById('pasteSpecBtn');
        if (pasteBtn) {
            pasteBtn.addEventListener('click', async () => {
                try {
                    const clipboardText = await navigator.clipboard.readText();
                    const parsed = JSON.parse(clipboardText);
                    runAsyncWithLoader(() => {
                        applyCompleteSpec(parsed);
                    }, 'Compiling Dashboard Specification...');
                } catch (err) {
                    const manualText = prompt("Paste your dashboard-spec.json specification here:");
                    if (manualText) {
                        try {
                            const parsed = JSON.parse(manualText);
                            runAsyncWithLoader(() => {
                                applyCompleteSpec(parsed);
                            }, 'Compiling Dashboard Specification...');
                        } catch (e) {
                            alert("Invalid JSON format. Please ensure valid dashboard-spec.json structure.");
                        }
                    }
                }
            });
        }
    });
    </script>
